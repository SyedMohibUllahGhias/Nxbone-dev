<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="10" fill="#1C1410"/>
  <!-- N letter in cyan/teal -->
  <text x="7" y="50" font-family="Arial Black, Arial" font-weight="900" font-size="46" fill="#38E5FF">N</text>
  <!-- Degree symbol superscript -->
  <text x="46" y="22" font-family="Arial" font-weight="700" font-size="18" fill="#38E5FF">°</text>
</svg>
